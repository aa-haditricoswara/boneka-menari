
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: "Segoe UI", Arial, sans-serif;
}

.stage {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  padding: 30px;
}

.toast {
  width: 760px;
  min-height: 190px;
  position: relative;
  display: grid;
  grid-template-columns: 145px 1fr;
  gap: 20px;
  align-items: center;
  padding: 20px;
  color: white;
  background: linear-gradient(120deg,#101014,#321015,#111114);
  border: 1px solid #d5ad60;
  border-left: 8px solid #b51f2b;
  border-radius: 14px;
  box-shadow: 0 10px 35px #0009;
  opacity: 0;
  transform: translateY(35px);
  pointer-events: none;
  overflow: hidden;
}

.toast.show {
  animation: masuk .45s ease forwards;
}

.toast.hide {
  animation: keluar .4s ease forwards;
}

@keyframes masuk {
  to { opacity: 1; transform: translateY(0); }
}

@keyframes keluar {
  to { opacity: 0; transform: translateY(25px); }
}

.cover {
  width: 145px;
  height: 145px;
  object-fit: cover;
  border-radius: 9px;
  border: 1px solid #d5ad60;
  background: #292929;
}

.status {
  display: inline-block;
  background: linear-gradient(90deg,#f3d995,#c99a43);
  color: #17120a;
  padding: 6px 12px;
  font-weight: 900;
  font-size: 15px;
  border-radius: 4px;
  margin-bottom: 9px;
}

.headline {
  color: #f6e4b7;
  font-size: 25px;
  font-weight: 950;
  margin-bottom: 8px;
}

.user {
  color: #e8bd67;
  font-size: 19px;
  font-weight: bold;
}

.song {
  font-size: 25px;
  font-weight: 800;
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #c7c3bd;
  font-size: 18px;
  margin-top: 4px;
}

.progress {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 5px;
  background: #ffffff22;
}

.progress::after {
  content: "";
  display: block;
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg,#a31525,#e5bd68);
  transform-origin: left;
}

.show .progress::after {
  animation: hitung 7s linear forwards;
}

@keyframes hitung {
  to { transform: scaleX(0); }
}

.shine {
  position: absolute;
  top: -100%;
  left: -30%;
  width: 20%;
  height: 300%;
  background: #ffffff18;
  transform: rotate(25deg);
  animation: kilau 3s infinite;
  pointer-events: none;
}

@keyframes kilau {
  0%,45% { left: -30%; }
  90%,100% { left: 130%; }
}
</style>
</head>

<body>
<div class="stage">
  <div class="toast" id="toast">
    <div class="shine"></div>

    <img class="cover" id="cover" alt="">

    <div>
      <div class="status">✓ REQUEST BERHASIL</div>
      <div class="headline">BERHASIL MASUK ANTREAN!</div>
      <div class="user" id="user">@penonton</div>
      <div class="song" id="song">Judul lagu</div>
      <div class="artist" id="artist">Nama artis</div>
    </div>

    <div class="progress"></div>
  </div>
</div>

<script>
const toast = document.getElementById("toast");
const cover = document.getElementById("cover");

let hideTimer;

function showNotification(data) {
  document.getElementById("user").textContent =
    "@" + String(data.nama || "Unknown").replace(/^@/, "");

  document.getElementById("song").textContent =
    data.title || "Judul lagu";

  document.getElementById("artist").textContent =
    data.artist || "Nama artis";

  cover.src = data.thumbnail || "";
  cover.onerror = () => cover.removeAttribute("src");

  toast.classList.remove("show", "hide");
  void toast.offsetWidth;
  toast.classList.add("show");

  clearTimeout(hideTimer);

  hideTimer = setTimeout(() => {
    toast.classList.remove("show");
    toast.classList.add("hide");
  }, 7000);
}

function connect() {
  const ws = new WebSocket("ws://127.0.0.1:8766");

  ws.onmessage = (event) => {
    try {
      const message = JSON.parse(event.data);

      if (message.event === "song_added") {
        showNotification(message.data || {});
      }
    } catch (error) {
      console.error(error);
    }
  };

  ws.onclose = () => setTimeout(connect, 3000);
  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
